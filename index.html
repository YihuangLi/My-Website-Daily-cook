<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What to eat</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>What to eat</h1>
    <button id="addBtn">＋ Add</button>
  </header>

  <main>
    <!-- Pick 抽签界面 -->
    <section id="draw" class="page active">
      <div class="draw-card">
        <div class="filter-group">
          <label style="font-weight:600; margin-right:8px;">Pick a recipe for:</label>
          <select id="drawMealFilter">
            <option value="all">All Meals</option>
            <option value="Breakfast">Breakfast</option>
            <option value="Lunch">Lunch</option>
            <option value="Dinner">Dinner</option>
            <option value="Dessert">Dessert</option>
          </select>
        </div>

        <div class="dice-container">
          <div id="dice">🎲</div>
        </div>

        <div id="result"></div>

        <div class="button-group">
          <button id="drawBtn">Pick a Recipe</button>
          <button id="againBtn" class="secondary hidden">Try Again</button>
          <button id="detailBtn" class="secondary hidden">View Details</button>
        </div>
      </div>
    </section>

    <!-- 菜谱列表界面 -->
    <section id="recipes" class="page">
      <div class="search-bar" style="margin-bottom: 15px;">
        <input type="text" id="searchInput" placeholder="Search recipe name or ingredients..." style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; outline:none;">
      </div>
      <div id="recipeList" class="grid"></div>
    </section>

    <!-- 详情界面 -->
    <section id="detail" class="page">
      <div id="detailContent"></div>
    </section>

    <!-- 个人界面 -->
    <section id="profile" class="page">
      <h2>Profile</h2>
      <div id="authContainer" style="margin-top: 15px;">
        <input type="email" id="authEmail" placeholder="Email" style="display:block; margin-bottom:10px; width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
        <input type="password" id="authPassword" placeholder="Password" style="display:block; margin-bottom:15px; width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
        <button id="loginBtn" style="width:100%; margin-bottom:8px;">Login</button>
        <button id="signUpBtn" class="secondary" style="width:100%;">Sign Up</button>
      </div>

      <div id="userControlSection" style="display:none; margin-top: 15px;">
        <p>Recipes count: <span id="count">0</span></p>
        <button id="logoutBtn" style="margin-top: 15px; width:100%;">Logout</button>
        <button id="deleteAccountBtn" class="secondary" style="margin-top: 10px; width:100%; background: #e74c3c; color: white;">Delete Account</button>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav active" data-page="draw">🎲 Pick</button>
    <button class="nav" data-page="recipes">📖 Recipes</button>
    <button class="nav" data-page="profile">👤 Profile</button>
  </nav>

  <!-- 编辑/新增 模态框弹窗 -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <h2>Recipe Details</h2>
      <input type="text" id="name" placeholder="Recipe Name">
      <input type="text" id="category" placeholder="Category (e.g. Home Cooking)">
      
      <div style="margin: 10px 0;">
        <label style="display:block; font-weight:600; margin-bottom:6px; font-size:14px;">Meal Type (Select multiple):</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="mealType" value="Breakfast"> Breakfast</label>
          <label><input type="checkbox" name="mealType" value="Lunch"> Lunch</label>
          <label><input type="checkbox" name="mealType" value="Dinner"> Dinner</label>
          <label><input type="checkbox" name="mealType" value="Dessert"> Dessert</label>
        </div>
      </div>

      <input type="number" id="minutes" placeholder="Cook Time (mins)">
      <textarea id="ingredients" placeholder="Ingredients (one per line)"></textarea>
      <textarea id="steps" placeholder="Instructions (one per line)"></textarea>
      <input type="file" id="image" accept="image/*" style="margin-bottom:15px;">
      <button id="saveBtn" style="width: 100%;">Save Recipe</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
