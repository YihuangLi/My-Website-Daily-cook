<!doctype html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fffaf2">
  <title>What's for Dinner?</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>What's for Dinner?</h1>
    <p>Save your recipes. Let fate pick your next meal.</p>
  </header>

  <main>
      <div id="authContainer" class="hero" style="margin-bottom: 20px;">
        <h2>Login / Sign Up</h2>
        <input id="authEmail" type="email" placeholder="Email" style="width:100%; margin-bottom:10px; padding:10px; border-radius:8px; border:1px solid #ccc;">
        <input id="authPassword" type="password" placeholder="Password" style="width:100%; margin-bottom:10px; padding:10px; border-radius:8px; border:1px solid #ccc;">
        <button id="loginBtn" class="primary">Log In</button>
        <button id="signUpBtn" class="secondary" style="width:100%; margin-top:8px;">Sign Up</button>
      </div>
      <!-- 在主界面合适的位置添加退出和注销按钮 -->
      <div id="userControlSection" style="display: none; margin-bottom: 20px;">
        <button id="logoutBtn" style="background-color: #6c757d; color: white;">Log Out</button>
        <button id="deleteAccountBtn" style="background-color: #dc3545; color: white;">Delete Account</button>
      </div>
    <section id="home" class="page active">
      <div class="hero">
        <div class="dice" id="dice">🎲</div>

        <div class="result" id="result">
          <span class="muted">What should we cook today?</span>
        </div>

        <button class="primary" id="drawBtn">Pick a Recipe</button>

        <div class="actions">
          <button id="againBtn" class="secondary hidden">
            Pick Again
          </button>
          <button id="detailBtn" class="secondary hidden">
            View Recipe
          </button>
        </div>
      </div>

      <div class="stats">
        <div>
          <strong id="count">0</strong>
          <span>Recipes</span>
        </div>
        <div>
          <strong id="recent">0</strong>
          <span>Recently Picked</span>
        </div>
      </div>
    </section>

    <section id="recipes" class="page">
      <div class="section-title">
        <h2>My Recipes</h2>
        <button id="addBtn">＋ Add</button>
      </div>

      <div id="recipeList" class="grid"></div>
    </section>

    <section id="detail" class="page">
      <button class="back" data-page="recipes">‹ Back</button>
      <div id="detailContent"></div>
    </section>
  </main>

  <nav>
    <button class="nav active" data-page="home">
      🎲<span>Today</span>
    </button>
    <button class="nav" data-page="recipes">
      🍳<span>Recipes</span>
    </button>
  </nav>

  <div class="modal hidden" id="modal">
    <div class="sheet">
      <button class="close" id="closeModal" aria-label="Close">×</button>

      <h2>Add a Recipe</h2>

      <label>
        Recipe Name
        <input id="name" placeholder="e.g. Tomato and Egg Noodles">
      </label>

      <label>
        Category
        <select id="category">
          <option>Home Cooking</option>
          <option>Noodles &amp; Pasta</option>
          <option>Rice Dishes</option>
          <option>Soups</option>
          <option>Breakfast</option>
          <option>Other</option>
        </select>
      </label>

      <label>
        Cooking Time (minutes)
        <input id="minutes" type="number" min="1" placeholder="30">
      </label>

      <label>
        Ingredients
        <textarea
          id="ingredients"
          placeholder="2 tomatoes&#10;2 eggs&#10;200 g noodles"
        ></textarea>
      </label>

      <label>
        Instructions
        <textarea
          id="steps"
          placeholder="1. ...&#10;2. ..."
        ></textarea>
      </label>

      <label>
        Photo
        <input id="image" type="file" accept="image/*">
      </label>

      <button class="primary" id="saveBtn">Save Recipe</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
